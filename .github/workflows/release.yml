name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal
      - name: Tag matches Cargo.toml
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo test --features webhooks
      # The first version is published by hand, because crates.io only accepts
      # a trusted publisher for a crate that already exists.
      - name: Skip a version already on crates.io
        id: existing
        run: |
          if curl -fsS -o /dev/null -A "TheDiscordList/integration-serenity release workflow" \
            "https://crates.io/api/v1/crates/thediscordlist-serenity/${{ steps.version.outputs.version }}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.existing.outputs.published != 'true'
        id: auth
      - if: steps.existing.outputs.published != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
